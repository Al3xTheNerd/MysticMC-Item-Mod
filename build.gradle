plugins {
    id 'net.fabricmc.fabric-loom' version '1.18.4'
}

version = project.mod_version
group = 'co.mysticmc.items'

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

base {
    archivesName = "mystic-item-browser-${project.minecraft_version}"
}

tasks.named('jar') {
    archiveFileName = "mystic-item-browser-${project.minecraft_version}-v${project.mod_version}.jar"
    from('LICENSE')
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-Xlint:deprecation')
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

tasks.named('sourcesJar') {
    archiveFileName = "mystic-item-browser-${project.minecraft_version}-v${project.mod_version}-sources.jar"
}

test { useJUnitPlatform() }

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}
